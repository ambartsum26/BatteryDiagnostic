name: DevicePulse 0.9.16 integrated PawnIO French
on:
  push:
    branches: [codex/devicepulse-0.9.16-layout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and apply improvements
        shell: pwsh
        run: |
          Expand-Archive devicepulse-source.zip source-unpacked
          Copy-Item source-unpacked/DevicePulse-0.9.7/* . -Recurse -Force
          Copy-Item overlays/src/* src/ -Recurse -Force
          Copy-Item qa/UpgradeTests.cs src/UpgradeTests.cs
          Copy-Item qa/InstallerTests.cs src/InstallerTests.cs
          Copy-Item qa/CompatibilityTests.cs src/CompatibilityTests.cs
          Copy-Item qa/SensorProviderTests.cs src/SensorProviderTests.cs
          $p = Get-Content src/Program.cs -Raw
          $p = $p.Replace('            // Automatically activate', '            if(args.Contains("--upgrade-test")) { ApplicationConfiguration.Initialize();UpgradeTests.Run();return; }' + [Environment]::NewLine + '            if(args.Contains("--installer-self-test")) { ApplicationConfiguration.Initialize();InstallerTests.Run();return; }' + [Environment]::NewLine + '            // Automatically activate')
          Set-Content src/Program.cs $p
      - name: Attach comprehensive audit tests
        shell: pwsh
        run: |
          Copy-Item qa/Audit*Tests.cs src/ -Force
          Copy-Item qa/FinalAuditTests.cs src/ -Force
          Copy-Item qa/NavigationTests.cs src/ -Force
          Copy-Item qa/LayoutTests.cs src/ -Force
          $p = Get-Content src/Program.cs -Raw
          $p = $p.Replace('            // Automatically activate', '            if(args.Contains("--audit-self-test")) { ApplicationConfiguration.Initialize();FinalAuditTests.Run();return; }' + [Environment]::NewLine + '            // Automatically activate')
          Set-Content src/Program.cs $p
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download and verify official embedded PawnIO setup without execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe'
          $expected = '1F519A22E47187F70A1379A48CA604981C4FCF694F4E65B734AAA74A9FBA3032'
          Invoke-WebRequest -Uri $url -OutFile src/Drivers/PawnIO_setup.exe
          $hash = (Get-FileHash src/Drivers/PawnIO_setup.exe -Algorithm SHA256).Hash
          if ($hash -ine $expected) { throw 'Official PawnIO setup hash mismatch' }
          $signature = Get-AuthenticodeSignature src/Drivers/PawnIO_setup.exe
          if ($signature.Status -ne 'Valid' -or !$signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch 'namazso') { throw 'Official PawnIO setup signature verification failed' }
          "PASS: official PawnIO.Setup 2.2.0 SHA256=$hash; signature=$($signature.Status); publisher=$($signature.SignerCertificate.Subject). Installer never executed in CI." | Set-Content pawnio-verification.txt
      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish src/BatteryDiagnostic.csproj -c Release -r win-x64 --self-contained true -o publish-win-x64 '-p:PublishSingleFile=true' '-p:IncludeNativeLibrariesForSelfExtract=true'
          if ($LASTEXITCODE -ne 0) { throw "Publish failed: $LASTEXITCODE" }
          if (!(Test-Path publish-win-x64/DevicePulse.exe)) { throw 'EXE missing' }
      - name: Install verified optional libcdi SMART backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/a1ive/nwinfo/releases/download/v1.6.6/NWinfo.zip'
          $expected = '52006A9280B53449375FD8D7211A2A8DEF7E287F93028BB469660CE877BD4A2E'
          Invoke-WebRequest -Uri $url -OutFile nwinfo.zip -ErrorAction Stop
          $actual = (Get-FileHash nwinfo.zip -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw 'NWinfo.zip SHA256 verification failed' }
          Expand-Archive nwinfo.zip -DestinationPath nwinfo-unpacked
          $dlls = @(Get-ChildItem nwinfo-unpacked -Filter libcdi.dll -Recurse -File)
          $x64 = @($dlls | Where-Object {
            $fs = [IO.File]::OpenRead($_.FullName)
            try {
              $br = [IO.BinaryReader]::new($fs)
              if ($br.ReadUInt16() -ne 0x5A4D) { return $false }
              [void]$fs.Seek(0x3c, [IO.SeekOrigin]::Begin)
              $offset = $br.ReadInt32()
              if ($offset -lt 64 -or $offset -gt $fs.Length - 24) { return $false }
              [void]$fs.Seek($offset, [IO.SeekOrigin]::Begin)
              if ($br.ReadUInt32() -ne 0x4550) { return $false }
              $br.ReadUInt16() -eq 0x8664
            }
            finally { $fs.Dispose() }
          })
          if ($x64.Count -ne 1) { throw "Expected one x64 libcdi.dll, got $($x64.Count)" }
          Copy-Item $x64[0].FullName publish-win-x64/libcdi.dll
          Copy-Item src/ThirdParty/libcdi/LICENSE.txt publish-win-x64/libcdi-LICENSE.txt
          Remove-Item nwinfo.zip -Force
          Remove-Item nwinfo-unpacked -Recurse -Force
      - name: Package verified smartmontools and complete model database without running installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.win32-setup.exe'
          Invoke-WebRequest $installer -OutFile smartmontools-setup.exe
          if ((Get-FileHash smartmontools-setup.exe -Algorithm SHA256).Hash -ine '896337FCC253220614CF8CDBD5CF2321C5AA326A37A04160A672A281E6104C70') { throw 'smartmontools installer hash mismatch' }
          & 'C:/Program Files/7-Zip/7z.exe' x smartmontools-setup.exe '-osmartmontools-unpacked' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract smartmontools without installation' }
          $target = Join-Path $PWD 'publish-win-x64/smartmontools'
          New-Item $target -ItemType Directory -Force | Out-Null
          Copy-Item smartmontools-unpacked/bin/smartctl.exe $target/smartctl.exe
          if ((Get-FileHash $target/smartctl.exe -Algorithm SHA256).Hash -ine 'B5DB94E5082C042BE44994B7A4FA8F7B5C8E713B2AB1C9A560D8F7A7995EA27D') { throw 'smartctl x64 hash mismatch' }
          Copy-Item smartmontools-unpacked/doc/COPYING.txt $target/COPYING.txt
          Invoke-WebRequest 'https://raw.githubusercontent.com/smartmontools/smartmontools/764fcfb2472920fcaeb62950e60cb8bf3f983065/smartmontools/drivedb.h' -OutFile $target/drivedb.h
          if ((Get-FileHash $target/drivedb.h -Algorithm SHA256).Hash -ine '428F9D56357CD35056719E1EF3FE2EFF87B5AE7499E7797E0811C38B2DBB7079') { throw 'drivedb hash mismatch' }
          Invoke-WebRequest 'https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.tar.gz' -OutFile $target/smartmontools-7.5-source.tar.gz
          if ((Get-FileHash $target/smartmontools-7.5-source.tar.gz -Algorithm SHA256).Hash -ine '690B83CA331378DA9EA0D9D61008C4B22DDE391387B9BBAD7F29387F2595F76E') { throw 'smartmontools corresponding source hash mismatch' }
          & $target/smartctl.exe --version | Set-Content $target/VERSION.txt
          if ($LASTEXITCODE -ne 0) { throw 'smartctl version check failed' }
          Copy-Item docs/SENSOR-COMPATIBILITY.md publish-win-x64/SENSOR-COMPATIBILITY.md
          # Version display only. No physical devices, SMART commands or installers run in CI.
      - name: Run synthetic self-tests without hardware activation
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'publish-win-x64'
          $exe = Join-Path $out 'DevicePulse.exe'
          $p = Start-Process $exe -ArgumentList '--self-test' -WorkingDirectory $out -PassThru
          if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Self-tests timed out' }
          if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
          if ($p.ExitCode -ne 0) { throw "Self-tests failed: $($p.ExitCode)" }
          if (!(Test-Path "$out/self-test.txt")) { throw 'Test result missing' }
          Get-Content "$out/self-test.txt"
      - name: Test integrated installer without executing it
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'publish-win-x64'
          $p = Start-Process (Join-Path $out 'DevicePulse.exe') -ArgumentList '--installer-self-test' -WorkingDirectory $out -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'Installer tests timed out' }
          if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
          if ($p.ExitCode -ne 0) { throw 'Installer tests failed' }
          Get-Content "$out/installer-tests.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PawnIO-installation-francaise
          path: publish-win-x64/pawnio-install-fr.png
          if-no-files-found: error
      - name: Test DDR and window behavior and render synthetic previews
        shell: pwsh
        run: |
          $source = Get-Content src/MainForm.cs -Raw
          try {
            $qa = $source.Replace('if(!closing){pollTimer.Start();StartPerformance();await RefreshOnce();}', '// Synthetic UI QA: no timers, inventory, hardware probes or drivers.')
            if ($qa -eq $source) { throw 'QA sensor isolation hook not found' }
            Set-Content src/MainForm.cs $qa
            dotnet publish src/BatteryDiagnostic.csproj -c Release -r win-x64 --self-contained true -o publish-win-x64 '-p:PublishSingleFile=true' '-p:IncludeNativeLibrariesForSelfExtract=true'
            if ($LASTEXITCODE -ne 0) { throw 'UI QA publish failed' }
            $out = Join-Path $PWD 'publish-win-x64'
            $p = Start-Process (Join-Path $out 'DevicePulse.exe') -ArgumentList '--upgrade-test' -WorkingDirectory $out -PassThru
            if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Upgrade tests timed out' }
            if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
            if ($p.ExitCode -ne 0) { throw 'Upgrade tests failed' }
            Get-Content "$out/upgrade-tests.txt"
          } finally {
            Set-Content src/MainForm.cs $source
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DevicePulse-0.9.16-UI-preview
          path: publish-win-x64/ui-preview/
          if-no-files-found: error
      - name: Keep previews out of portable package
        shell: pwsh
        run: Remove-Item publish-win-x64/ui-preview -Recurse -Force
      - name: Final audit regressions and visible full-interface fixtures
        shell: pwsh
        run: |
          $source = Get-Content src/MainForm.cs -Raw
          try {
            $qa = $source.Replace('if(!closing){pollTimer.Start();StartPerformance();await RefreshOnce();}','// Audit QA: physical sensor startup disabled.')
            if ($qa -eq $source) { throw 'Audit QA startup isolation missing' }
            Set-Content src/MainForm.cs $qa
            dotnet publish src/BatteryDiagnostic.csproj -c Release -r win-x64 --self-contained true -o publish-win-x64
            if ($LASTEXITCODE -ne 0) { throw 'Audit QA publish failed' }
            $out = Join-Path $PWD 'publish-win-x64'
            $p = Start-Process (Join-Path $out 'DevicePulse.exe') -ArgumentList '--audit-self-test' -WorkingDirectory $out -PassThru
            if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Final audit tests timed out' }
            Get-Content "$out/audit-regressions.txt"
            if (Test-Path "$out/audit-visual.txt") { Get-Content "$out/audit-visual.txt" }
            if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
            if ($p.ExitCode -ne 0) { throw 'Final audit tests failed' }
          } finally { Set-Content src/MainForm.cs $source }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Final-audit-interface-and-tests
          path: |
            publish-win-x64/final-audit-preview/
            publish-win-x64/audit-regressions.txt
            publish-win-x64/audit-visual.txt
            publish-win-x64/navigation-tests.txt
            publish-win-x64/layout-tests.txt
            publish-win-x64/error.txt
      - name: Keep audit images out of portable ZIP
        shell: pwsh
        run: |
          if (Test-Path publish-win-x64/final-audit-preview) { Remove-Item publish-win-x64/final-audit-preview -Recurse -Force }
      - name: Publish production EXE requiring administrator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$manifest = Get-Content src/app.manifest
          $level = $manifest.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if (!$level -or $level.level -ne 'asInvoker') { throw 'Unexpected original privilege level' }
          $level.SetAttribute('level', 'requireAdministrator')
          $manifest.Save((Join-Path $PWD 'src/app.manifest'))
          dotnet publish src/BatteryDiagnostic.csproj -c Release -r win-x64 --self-contained true -o publish-win-x64 '-p:PublishSingleFile=true' '-p:IncludeNativeLibrariesForSelfExtract=true'
          if ($LASTEXITCODE -ne 0) { throw "Admin publish failed: $LASTEXITCODE" }
          $mt = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Filter mt.exe -Recurse -File | Where-Object { $_.FullName -match '\\x64\\mt.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$mt) { throw 'Windows manifest inspection tool missing' }
          & $mt.FullName -nologo '-inputresource:publish-win-x64/DevicePulse.exe;#1' '-out:published.manifest'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract production manifest' }
          [xml]$actual = Get-Content published.manifest
          $actualLevel = $actual.SelectSingleNode("//*[local-name()='requestedExecutionLevel']")
          if (!$actualLevel -or $actualLevel.level -ne 'requireAdministrator') { throw 'Production EXE is not requireAdministrator' }
          Copy-Item published.manifest publish-win-x64/published.manifest
          'PASS: requireAdministrator verified in compiled DevicePulse.exe. Production EXE not launched in CI; synthetic tests passed on the same source with asInvoker before republishing.' | Set-Content publish-win-x64/manifest-verification.txt
      - name: Package clean portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item portable-clean/smartmontools,portable-clean/licenses -ItemType Directory -Force | Out-Null
          Copy-Item publish-win-x64/DevicePulse.exe portable-clean/DevicePulse.exe
          Copy-Item publish-win-x64/libcdi.dll portable-clean/libcdi.dll
          Copy-Item publish-win-x64/libcdi-LICENSE.txt portable-clean/licenses/libcdi-LICENSE.txt
          Copy-Item src/ThirdPartyNotices.txt portable-clean/licenses/ThirdPartyNotices.txt
          @'
          Official unchanged PawnIO.Setup 2.2.0: https://github.com/namazso/PawnIO.Setup/releases/tag/2.2.0 . Embedded installer SHA256: 1F519A22E47187F70A1379A48CA604981C4FCF694F4E65B734AAA74A9FBA3032 . Authenticode verified in CI and rechecked at runtime before explicit user-approved installation.
          '@ | Set-Content portable-clean/licenses/PawnIO-NOTICE.txt
          foreach ($name in @('smartctl.exe','drivedb.h','COPYING.txt','smartmontools-7.5-source.tar.gz')) {
            Copy-Item (Join-Path publish-win-x64/smartmontools $name) (Join-Path portable-clean/smartmontools $name)
          }
          Copy-Item docs/README-PORTABLE.txt portable-clean/README.txt
          if (@(Get-ChildItem portable-clean -File -Recurse).Count -ne 10) { throw 'Portable allowlist must contain exactly 10 files' }
          foreach ($name in @('DevicePulse.exe','libcdi.dll')) {
            if ((Get-FileHash (Join-Path publish-win-x64 $name)).Hash -ne (Get-FileHash (Join-Path portable-clean $name)).Hash) { throw 'Portable payload changed' }
          }
      - name: Package complete reproducible application source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item complete-source/src -ItemType Directory -Force | Out-Null
          $sourceRoot = (Resolve-Path src).Path
          foreach ($file in Get-ChildItem src -File -Recurse) {
            $relative = [IO.Path]::GetRelativePath($sourceRoot, $file.FullName)
            if ($relative -match '(^|[\\/])(bin|obj)[\\/]') { continue }
            $target = Join-Path (Join-Path $PWD 'complete-source/src') $relative
            New-Item ([IO.Path]::GetDirectoryName($target)) -ItemType Directory -Force | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Copy-Item docs/SENSOR-COMPATIBILITY.md complete-source/README.md
          Compress-Archive complete-source/* DevicePulse-0.9.16-complete-source.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: DevicePulse-0.9.16-complete-source
          path: DevicePulse-0.9.16-complete-source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DevicePulse-0.9.16-Windows-x64-Admin-PawnIO-FR
          path: portable-clean/
          if-no-files-found: error
