name: PawnIO installer integration regression
on:
  push:
    branches: [build/devicepulse-0.9.10-pawnio-fr]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract existing DevicePulse and regression tests
        shell: pwsh
        run: |
          Expand-Archive devicepulse-source.zip source-unpacked
          Copy-Item source-unpacked/DevicePulse-0.9.7/* . -Recurse -Force
          Copy-Item overlays/src/* src/ -Recurse -Force
          Copy-Item qa/InstallerTests.cs src/InstallerTests.cs
          $p = Get-Content src/Program.cs -Raw
          $p = $p.Replace('            // Automatically activate', '            if(args.Contains("--installer-self-test")) { ApplicationConfiguration.Initialize();InstallerTests.Run();return; }' + [Environment]::NewLine + '            // Automatically activate')
          Set-Content src/Program.cs $p
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Confirm missing integrated installer
        shell: pwsh
        run: |
          dotnet publish src/BatteryDiagnostic.csproj -c Release -r win-x64 --self-contained true -o qa-before
          if ($LASTEXITCODE -ne 0) { throw 'Regression baseline compilation failed' }
          $p = Start-Process (Join-Path $PWD 'qa-before/DevicePulse.exe') -ArgumentList '--installer-self-test' -WorkingDirectory (Join-Path $PWD 'qa-before') -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'Regression baseline timed out' }
          $message = Get-Content qa-before/error.txt -Raw
          Write-Host $message
          if ($p.ExitCode -eq 0 -or $message -notmatch 'integrated PawnIO installer is missing') { throw 'Expected regression failure missing' }
          Write-Host 'RED confirmed: baseline does not embed or offer PawnIO installation.'
