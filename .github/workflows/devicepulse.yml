name: DevicePulse window and DDR regression
on:
  push:
    branches: [build/devicepulse-ui-0.9.9]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract baseline and attach regression tests
        shell: pwsh
        run: |
          Expand-Archive devicepulse-source.zip source-unpacked
          Copy-Item source-unpacked/DevicePulse-0.9.7/* . -Recurse -Force
          Copy-Item qa/UpgradeTests.cs src/UpgradeTests.cs
          $p = Get-Content src/Program.cs -Raw
          $p = $p.Replace('            // Automatically activate', '            if(args.Contains("--upgrade-test")) { ApplicationConfiguration.Initialize();UpgradeTests.Run();return; }' + [Environment]::NewLine + '            // Automatically activate')
          Set-Content src/Program.cs $p
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prove regression tests detect missing DDR and maximize
        shell: pwsh
        run: |
          dotnet publish src/BatteryDiagnostic.csproj -c Release -r win-x64 --self-contained true -o qa-before '-p:PublishSingleFile=true' '-p:IncludeNativeLibrariesForSelfExtract=true'
          if ($LASTEXITCODE -ne 0) { throw 'Regression baseline failed to compile' }
          $p = Start-Process (Join-Path $PWD 'qa-before/DevicePulse.exe') -ArgumentList '--upgrade-test' -WorkingDirectory (Join-Path $PWD 'qa-before') -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'Baseline timed out' }
          $errors = Get-Content qa-before/error.txt -Raw
          Write-Host $errors
          if ($p.ExitCode -eq 0 -or $errors -notmatch 'DDR decoder DDR3' -or $errors -notmatch 'maximize and restore button exists') { throw 'Regression did not fail for the expected missing features' }
          Write-Host 'RED confirmed: baseline lacks DDR decoding and maximize/restore button.'
